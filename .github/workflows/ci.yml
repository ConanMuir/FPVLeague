# CI for Jared's Vite build (src/) and the Interceptor harness. Two jobs run side by side:
#   fast     build, node:test unit tests, parts balance, comment lint (strict): reports in a minute or two
#   browser  the headless-browser checks, sharded across matrix entries, on the runner's Chrome with software WebGL (SwiftShader);
#            draw calls are skipped outside the checks' drawFrames() checkpoints, and an entry is skipped when its area is untouched
# Locally the same tools use Edge (or EDGE_PATH / CHROME_PATH); see tools/browser.mjs and the README.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  FORCE_COLOR: '0'

jobs:
  fast:
    name: Build, unit tests, parts balance, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # the comment lint diffs against the base branch

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build (vite build + postbuild)
        run: npm run build

      - name: Committed built game is up to date (warn-only)
        # postbuild writes games/drone-league/index.html; compare it with the committed one (ignoring CRLF vs LF builds)
        run: node tools/check-build.mjs

      - name: Unit tests (node:test)
        run: npm test

      - name: Parts balance
        run: node tools/parts-balance.mjs

      - name: Comment lint (strict)
        # flags added/changed lines where a // comment appears to swallow code; annotations show on the PR diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node tools/lint-comments.mjs --strict --base "$BASE"

  browser:
    name: Browser check (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # area: which files make the check worth running (tools/ci-scope.mjs); everything runs on main
          - check: smoke (main + v15 baseline)
            area: league
            build: true
            run: node tools/smoke.mjs --parts=main
          - check: smoke (controls, Lab, training)
            area: league
            build: true
            run: node tools/smoke.mjs --parts=lab,train
          - check: physics-check
            area: league
            run: node tools/physics-check.mjs
          - check: pop-check
            area: league
            run: node tools/pop-check.mjs
          - check: sound-check
            area: league
            run: node tools/sound-check.mjs
          - check: sound-level
            area: league
            run: node tools/sound-level.mjs
          - check: spin-check
            area: league
            run: node tools/spin-check.mjs
          - check: training-check
            area: league
            run: node tools/training-check.mjs
          - check: zombies-test (saves, meta)
            area: interceptor
            run: node tools/zombies-test.mjs --sections=saves,meta
          # the campaign plays several sectors end to end and pushed the shared job past its 20 min timeout
          - check: zombies-test (campaign)
            area: interceptor
            run: node tools/zombies-test.mjs --sections=campaign
          # the grid section plays a seeded wave twice (grid vs brute force), so it gets its own job
          - check: zombies-test (grid)
            area: interceptor
            run: node tools/zombies-test.mjs --sections=grid
          - check: zombies-test (swarm, spectator, reentry)
            area: interceptor
            run: node tools/zombies-test.mjs --sections=swarm,spectator,reentry
          - check: zombies-test (zombies, roster)
            area: interceptor
            run: node tools/zombies-test.mjs --sections=zombies,roster
          - check: zombies-test (helpers, weather, chain, sorties)
            area: interceptor
            run: node tools/zombies-test.mjs --sections=helpers,weather,chain,sorties
          # Zombies co-op: a host and two clients over the ?netloop transport in one headless browser
          - check: zombies-coop
            area: interceptor
            run: node tools/zombies-coop.mjs
          - check: zombies-test (bosses)
            area: interceptor
            run: node tools/zombies-test.mjs --sections=bosses
          - check: zombies-test (arsenal)
            area: interceptor
            run: node tools/zombies-test.mjs --sections=arsenal
          # the PIP / lock-on intercept point against where you actually meet the track, and where it is drawn in each view
          - check: intercept-check
            area: interceptor
            run: node tools/intercept-check.mjs
          # visual glitch guards (tools/glitch-check.mjs): the river below its banks, weather motes at the lens, dynamic-resolution target
          # sizes, the Dogfight cave-mouth trim over its seam
          - check: glitch-check (Interceptor)
            area: interceptor
            run: node tools/glitch-check.mjs river motes dynres --only=interceptor
          - check: glitch-check (League)
            area: league
            build: true
            run: node tools/glitch-check.mjs motes dynres mouths --only=league
          # the Interceptor dart's golden flight trajectories (both Leagues' are node tests in npm test)
          - check: flight-golden
            area: interceptor
            run: node tools/flight-golden.mjs
          # the Jammer King's electronic-warfare duel: the pip under jamming and after a burn-through, distance and emitters, the HUD, the bot, all cleared with the wave
          - check: zombies-test (ew)
            area: interceptor
            run: node tools/zombies-test.mjs --sections=ew
          # the bot self-play ladder: one tiny generation (one archetype, one child, 1 sim minute) twice, and its file through the loader
          - check: bot-ladder-check
            area: league
            run: node tools/bot-ladder-check.mjs
          # selling with an Undo until the wave starts (the refund rule, opened positions, a dome's stock, the kill chain, a co-op client's request to the host) and the campaign map's three-modifier cap
          - check: zombies-test (sell)
            area: interceptor
            run: node tools/zombies-test.mjs --sections=sell
          # the Bot Spectator explores: roams the map, flies the sorties, uses its systems, never sticks, holds the benchmark's wave (one visual run, four headless)
          - check: zombies-test (explore)
            area: interceptor
            run: node tools/zombies-test.mjs --sections=explore
          # the spectator's Director camera: its moments, shots, framing, cuts, clean-up and cost (a scripted wave flown by a bot)
          - check: zombies-test (director)
            area: interceptor
            run: node tools/zombies-test.mjs --sections=director
    env:
      DL_SWIFTSHADER: '1'   # no GPU on the runner: software WebGL (tools/browser.mjs)
      DL_NORENDER: '1'      # skip draw calls except at the checks' drawFrames() checkpoints (SwiftShader draws ~1 fps)
      DL_TIMING_WARN: '1'   # wall-clock budgets (e.g. physics-check's ms per tick) only warn here
    steps:
      - uses: actions/checkout@v6

      - name: Does this change touch the ${{ matrix.area }} files?
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node tools/ci-scope.mjs ${{ matrix.area }} "$BASE"

      - uses: actions/setup-node@v6
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Browser (the runner's Chrome; download one only if it has none)
        id: sys
        if: steps.scope.outputs.run == 'true'
        run: |
          p=$(command -v google-chrome || command -v google-chrome-stable || true)
          echo "path=$p" >> "$GITHUB_OUTPUT"
          if [ -n "$p" ]; then "$p" --version; else echo "no Chrome on the runner"; fi

      - uses: browser-actions/setup-chrome@v2
        id: chrome
        if: steps.scope.outputs.run == 'true' && steps.sys.outputs.path == ''
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Build (smoke tests the built file)
        if: steps.scope.outputs.run == 'true' && matrix.build
        run: npm run build

      - name: ${{ matrix.check }}
        if: steps.scope.outputs.run == 'true'
        env:
          CHROME_PATH: ${{ steps.sys.outputs.path || steps.chrome.outputs.chrome-path }}
        # a browser check that fails is run once more: a real break fails twice, a timing flake on a slow runner passes and is flagged
        run: |
          ${{ matrix.run }} || { echo "::warning title=Flaky check::${{ matrix.check }} failed once and was retried"; ${{ matrix.run }}; }
